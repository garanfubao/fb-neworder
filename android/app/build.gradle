plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI se dat KEYSTORE_FILE (giai ma tu GitHub Secret) de ky co dinh.
// May local khong co bien nay -> tu dung debug key, van build binh thuong.
def envKeystore = System.getenv('KEYSTORE_FILE')
def hasReleaseKeystore = envKeystore != null && !envKeystore.trim().isEmpty()

android {
    namespace 'com.fubao.orderdisplay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fubao.orderdisplay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(envKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
