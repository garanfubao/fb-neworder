name: Build APK

# Chay khi push len main, hoac bam tay o tab Actions (Run workflow)
on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore (neu da tao Secret)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fubao-release.p12"
            echo "path=$RUNNER_TEMP/fubao-release.p12" >> "$GITHUB_OUTPUT"
            echo "Da co keystore -> ky bang key co dinh"
          else
            echo "Chua co Secret SIGNING_KEYSTORE_BASE64 -> tam ky bang debug key"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: fubaostore
          KEY_ALIAS: fubao
          KEY_PASSWORD: fubaostore
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fubao-order-display-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
